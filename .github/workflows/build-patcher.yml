name: Build patcher package

# Builds the 26.2 patcher's Java command-line and GUI jars from the private pxdns/eaglercraft-26.2 repo and
# publishes them as a GitHub Release in THIS repository. Only the patcher source is built: the source-patch bundle,
# project skeleton and resource overlay are not in that repo, and the package never contains Mojang's client jar
# (the person who runs the patcher supplies their own). Needs the PATCHER_TOKEN secret (see docs/SETUP.md).
#
# Run it by hand: Actions > Build patcher package > Run workflow. Nothing else triggers it, so a pull request can
# never run this workflow with the secret.
on:
  workflow_dispatch:
    inputs:
      patcher_ref:
        description: "Branch, tag or commit of pxdns/eaglercraft-26.2"
        default: "main"
      publish:
        description: "Publish a release when the build succeeds"
        type: boolean
        default: true

concurrency:
  group: build-patcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # only to create the release
    steps:
      - name: Check the access token is set
        env:
          PATCHER_TOKEN: ${{ secrets.PATCHER_TOKEN }}
        run: |
          if [ -z "$PATCHER_TOKEN" ]; then
            echo "::error::The PATCHER_TOKEN secret is not set. See docs/SETUP.md."
            exit 1
          fi

      - name: Check out the private source (only the patcher folder)
        uses: actions/checkout@v7
        with:
          repository: pxdns/eaglercraft-26.2
          ref: ${{ inputs.patcher_ref }}
          token: ${{ secrets.PATCHER_TOKEN }}
          path: src
          persist-credentials: false      # the token is not left in the checkout's git config
          fetch-depth: 1
          sparse-checkout: src/patcher
          sparse-checkout-cone-mode: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the command-line and GUI jars
        run: bash src/src/patcher/patcher/java-cli/build.sh

      - name: Collect the jars
        run: |
          out=src/src/patcher/patcher/java-cli/build
          mkdir -p dist
          cp "$out/eaglercraft-26.2-u1-patcher-gui.jar" dist/Eaglercraft-26.2-patcher-gui.jar
          cp "$out/eaglercraft-26.2-java-cli.jar"       dist/Eaglercraft-26.2-patcher-cli.jar
          cp "$out/receipt.json"                         dist/build-receipt.json
          cd dist
          sha256sum *.jar | tee SHA256SUMS
          ls -la

      - name: Check that no Minecraft jar or game file is in the package
        run: |
          for j in dist/*.jar; do
            if unzip -Z1 "$j" | grep -iE '(^|/)(minecraft[-_.0-9a-z]*client|client)[-_.0-9a-z]*\.jar$|^net/minecraft/|^com/mojang/'; then
              echo "::error::Game files found in $j"; exit 1
            fi
          done
          echo "no Minecraft jar or game classes in the package"

      - name: Publish a release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="26.2-r${GITHUB_RUN_NUMBER}"
          notes="Patcher jars for Minecraft 26.2, built from the patcher source. Run the GUI jar with Java 17 or newer: java -jar Eaglercraft-26.2-patcher-gui.jar. You supply your own official Minecraft 26.2 client jar; it is not included. These jars do not include the source-patch bundle, project skeleton or resource overlay, so they are not a complete setup on their own."
          gh release create "$tag" dist/Eaglercraft-26.2-patcher-gui.jar dist/Eaglercraft-26.2-patcher-cli.jar dist/SHA256SUMS dist/build-receipt.json \
            --repo "$GITHUB_REPOSITORY" --title "Minecraft 26.2 patcher jars (r${GITHUB_RUN_NUMBER})" --notes "$notes"

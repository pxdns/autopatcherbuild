name: Delete a release

# Removes one release and its tag from this repository. Run it by hand: Actions > Delete a release > Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete (for example 26.2-r9)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
